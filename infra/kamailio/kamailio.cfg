#!KAMAILIO
# =============================================================================
#  kamailio.cfg — SIP-over-WebSocket(WSS) edge in front of Asterisk.
#
#  Role:
#   * Terminate the browser's secure WebSocket (WSS) SIP signaling.
#   * Use RTPEngine to bridge WebRTC media (ICE + DTLS-SRTP) <-> plain RTP
#     that Asterisk understands.
#   * Relay all SIP transparently to Asterisk (which is the registrar + does
#     authentication + dialplan). Kamailio stays in the path (record-route +
#     Path) so in-dialog and inbound requests flow back through it.
#
#  The two trickiest knobs to tune during live testing are:
#   (1) the rtpengine_manage() flag sets in route[RTPENGINE]/onreply, and
#   (2) NAT handling for WS contacts. Both are commented inline.
# =============================================================================

####### Defines #######
#!define WITH_TLS
#!define WITH_WEBSOCKETS
#!define FLT_NAT 5
#!define FLB_NATB 6
#!define FLB_NATSIPPING 7
# Branch flag: this call leg faces a WebRTC (WS) client, so the SDP answer
# returned to it must be re-encrypted (DTLS-SRTP + ICE). Branch flags persist
# into onreply_route, unlike the received transport.
#!define FLB_WEBRTC 8

####### Global Parameters #######
debug=2
log_stderror=yes
fork=yes
children=4

# Asterisk is reached by its compose service name. RTPEngine runs on the host
# network; Kamailio reaches its control socket via Kamailio's OWN bridge
# gateway (the host). host.docker.internal points at docker0 (a different
# bridge) which docker isolates, so we use the compose-network gateway IP.
# substdef does global text replacement (works inside quoted strings too).
#!substdef "!ASTERISK_HOST!asterisk!g"
#!substdef "!RTPENGINE_HOST!172.18.0.1!g"

# Plain SIP (for debugging / Asterisk side) and TLS (carries WSS).
listen=udp:0.0.0.0:5060
listen=tls:0.0.0.0:8443

tcp_connection_lifetime=3604
tcp_accept_no_cl=yes
tcp_rd_buf_size=16384

enable_tls=yes

####### Modules #######
loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "cfg_rpc.so"
loadmodule "counters.so"
loadmodule "path.so"
loadmodule "xlog.so"
loadmodule "nathelper.so"
loadmodule "rtpengine.so"
loadmodule "tls.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"

####### Module params #######
# --- rr: keep us in the dialog path; don't append fromtag to enable later. ---
modparam("rr", "append_fromtag", 0)

# --- nathelper: keepalive pings (handled by websocket for WS clients). ---
modparam("nathelper", "natping_interval", 0)

# --- rtpengine: control socket of the rtpengine container. ---
modparam("rtpengine", "rtpengine_sock", "udp:RTPENGINE_HOST:22222")

# --- tls: cert/key for WSS (generate with mkcert into ./certs). ---
modparam("tls", "config", "/etc/kamailio/tls.cfg")

# --- websocket: keepalive to detect dead browser sockets. ---
modparam("websocket", "keepalive_mechanism", 1)
modparam("websocket", "keepalive_timeout", 30)

####### Routing Logic #######

request_route {
    # Sanity / max-forwards
    route(REQINIT);

    # Handle the websocket keepalive PING/PONG transparently
    if (nat_uac_test("64")) {
        # WS source; mark for NAT handling
        setflag(FLT_NAT);
    }

    # CANCEL handling
    if (is_method("CANCEL")) {
        if (t_check_trans()) { route(RELAY); }
        exit;
    }

    # In-dialog requests: follow the route set
    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    # NAT fixups for WS contacts
    route(NATMANAGE);

    # Record-route dialog-creating requests so we stay in path
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # REGISTER -> add Path and relay to Asterisk (the registrar)
    if (is_method("REGISTER")) {
        add_path_received();
        route(TOASTERISK);
        exit;
    }

    # INVITE -> anchor media in rtpengine, then relay to Asterisk
    if (is_method("INVITE")) {
        route(RTPENGINE);
    }

    route(TOASTERISK);
}

####### Sub-routes #######

route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP from $si:$sp\n");
        exit;
    }
}

# NAT fixups: WS clients advertise unroutable contacts; rewrite them.
# REGISTER is handled separately via add_path_received() (Asterisk is the
# registrar), so we only fix Contact on non-REGISTER requests here.
route[NATMANAGE] {
    force_rport();
    if (!is_method("REGISTER") && nat_uac_test("19")) {
        fix_nated_contact();
    }
    setflag(FLT_NAT);
}

# In-dialog: re-anchor media on re-INVITE, then loose-route.
route[WITHINDLG] {
    if (loose_route()) {
        if (is_method("INVITE")) {
            record_route();
            route(RTPENGINE);
        }
        route(RELAY);
        exit;
    }
    if (is_method("ACK")) {
        if (t_check_trans()) { route(RELAY); }
        exit;
    }
    sl_send_reply("404", "Not Here");
    exit;
}

# Media bridging. Request leg (offer):
#  - From the browser (WS/WSS): the SDP is WebRTC (ICE + DTLS + SRTP). Strip
#    that toward Asterisk -> "ICE=remove RTP/AVP".
#  - From Asterisk (UDP) toward the browser: add ICE + DTLS + SRTP
#    -> "ICE=force RTP/SAVPF" (done in onreply_route for the answer).
route[RTPENGINE] {
    if (proto == WS || proto == WSS) {
        # Offer came from the browser (WebRTC=external). Toward Asterisk
        # (internal): plain RTP. Remember this leg faces a WebRTC client.
        setbflag(FLB_WEBRTC);
        rtpengine_manage("trust-address replace-origin replace-session-connection direction=external direction=internal ICE=remove RTP/AVP");
    } else {
        # Offer toward a browser (inbound case): make it WebRTC.
        rtpengine_manage("trust-address replace-origin replace-session-connection direction=internal direction=external ICE=force RTP/SAVPF");
    }
    # Arm the reply-side handling
    t_on_reply("MANAGE_REPLY");
}

# Forward everything to Asterisk.
route[TOASTERISK] {
    $du = "sip:ASTERISK_HOST:5060";
    route(RELAY);
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# Answer leg: bridge media back. If the answer is heading to the WS client,
# build a WebRTC-compatible SDP; otherwise plain RTP.
onreply_route[MANAGE_REPLY] {
    if (status =~ "(180)|(183)|(2[0-9][0-9])") {
        # If this leg faces a WebRTC client, the answer must be DTLS-SRTP+ICE.
        # (Branch flag, NOT proto: the reply itself arrives over UDP from Asterisk.)
        if (isbflagset(FLB_WEBRTC)) {
            # Answer from Asterisk (internal) heading to the browser (external).
            rtpengine_manage("trust-address replace-origin replace-session-connection direction=internal direction=external ICE=force RTP/SAVPF");
        } else {
            rtpengine_manage("trust-address replace-origin replace-session-connection direction=external direction=internal ICE=remove RTP/AVP");
        }
    }
}

####### WebSocket handshake #######
# Browsers connect with an HTTP GET + Upgrade: websocket. xhttp dispatches it
# here; websocket.so completes the SIP-over-WS handshake.
event_route[xhttp:request] {
    if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade" && $rm == "GET") {
        if (ws_handle_handshake()) { exit; }
    }
    xhttp_reply("404", "Not Found", "", "");
}

event_route[websocket:closed] {
    xlog("L_INFO", "WebSocket connection from $si:$sp closed\n");
}
