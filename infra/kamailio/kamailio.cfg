#!KAMAILIO
# =============================================================================
#  kamailio.cfg — SIP-over-WebSocket(WSS) edge in front of Asterisk.
#
#  Role (signaling only):
#   * Terminate the browser's secure WebSocket (WSS) SIP signaling.
#   * Relay SIP transparently to Asterisk, staying in the path (record-route +
#     Path). The SDP is passed through UNTOUCHED — Asterisk now terminates the
#     WebRTC media itself (native DTLS-SRTP + ICE + TURN), so there is no
#     RTPEngine and Kamailio never touches media.
# =============================================================================

####### Defines #######
#!define WITH_TLS
#!define WITH_WEBSOCKETS
#!define FLT_NAT 5

####### Global Parameters #######
debug=2
log_stderror=yes
fork=yes
children=4

# Asterisk is reached by its compose service name.
#!substdef "!ASTERISK_HOST!asterisk!g"

# SINGLE WS path: the browser connects DIRECTLY over WSS to tls:8443
# (wss://softpad.tech:8443). We deliberately do NOT proxy SIP through Caddy and
# do NOT run a second plain-WS listener — having two ws-bearing sockets made the
# WebSocket connection lookup ambiguous and the inbound 200 OK's ACK was lost
# (via_builder "connection id 0", 32s Timer H, dropped call). One socket = no
# ambiguity. No `advertise` on the WS socket either: the WS connection table is
# keyed by the real socket, and in-dialog routing to the client is done by
# handle_ruri_alias() (see WITHINDLG), not by the WS Record-Route. advertise
# stays only on the UDP (Asterisk-facing) socket so Asterisk can route to us.
listen=udp:0.0.0.0:5060 advertise kamailio:5060
listen=tls:0.0.0.0:8443

tcp_connection_lifetime=3604
tcp_accept_no_cl=yes
tcp_rd_buf_size=16384

enable_tls=yes

####### Modules #######
loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "cfg_rpc.so"
loadmodule "counters.so"
loadmodule "path.so"
loadmodule "xlog.so"
loadmodule "nathelper.so"
loadmodule "tls.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"

####### Module params #######
modparam("rr", "append_fromtag", 0)
modparam("nathelper", "natping_interval", 0)
modparam("tls", "config", "/etc/kamailio/tls.cfg")
modparam("websocket", "keepalive_mechanism", 1)
modparam("websocket", "keepalive_timeout", 30)

####### Routing Logic #######

request_route {
    route(REQINIT);

    if (nat_uac_test("64")) {
        setflag(FLT_NAT);
    }

    # CANCEL handling
    if (is_method("CANCEL")) {
        if (t_check_trans()) { route(RELAY); }
        exit;
    }

    # In-dialog requests: follow the route set
    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    # NAT fixups for WS contacts (signaling only)
    route(NATMANAGE);

    # Record-route dialog-creating requests so we stay in path
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # REGISTER -> relay to Asterisk (the registrar). NATMANAGE already rewrote
    # the WS client's Contact with an ;alias so inbound calls can find it again.
    if (is_method("REGISTER")) {
        route(TOASTERISK);
        exit;
    }

    # Split strictly by transport so the two directions can't cross:
    #   * From the browser's WebSocket          = OUTBOUND -> Asterisk.
    #   * UDP from Asterisk to a WS client       = INBOUND: the Contact alias we
    #     stored at REGISTER rides in the request's R-URI. handle_ruri_alias()
    #     decodes it and targets the browser's live WSS connection.
    if (proto == WS || proto == WSS) {
        route(TOASTERISK);
        exit;
    }
    if (handle_ruri_alias()) {
        # INBOUND dialog-creating request (Asterisk INVITE → WS client). Arm the
        # reply route so the browser's 1xx/2xx Contact gets aliased on the way
        # back to Asterisk. Without that, Asterisk stores the dialog target as the
        # browser's masked "<rand>.invalid" Contact, and its ACK to the 200 OK is
        # routed to that unroutable host — the ACK is lost, SIP.js keeps
        # retransmitting the 200 OK, and won't send the BYE for ~15-20s. Armed
        # PER-TRANSACTION (not globally) so it can NEVER touch qualify-OPTIONS or
        # REGISTER replies (doing that globally with set_contact_alias broke WS
        # registration: via_builder couldn't find the WS connection for those).
        if (is_method("INVITE")) {
            t_on_reply("WS_REPLY");
        }
        route(RELAY);
        exit;
    }

    # Fallback (UDP, no alias): hand to Asterisk.
    route(TOASTERISK);
}

####### Sub-routes #######

route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP from $si:$sp\n");
        exit;
    }
}

# NAT fixups: WS clients advertise unroutable contacts; rewrite them.
route[NATMANAGE] {
    force_rport();
    if (is_method("REGISTER")) {
        # WS/WSS client behind NAT: rewrite its Contact to point back at us with
        # an ;alias holding its real connection (ip~port~proto). Asterisk stores
        # this contact (rewrite_contact=no), so an inbound call to it returns
        # here and handle_ruri_alias() recovers the live WSS socket. We then
        # retarget the host to our SIP/UDP socket — Asterisk only speaks UDP, and
        # set_contact_alias() leaves the host on our WSS port.
        if (proto == WS || proto == WSS) {
            # Append ;alias=ip~port~proto holding the client's live WSS socket.
            # Asterisk (rewrite_contact=yes) then rewrites the Contact HOST to the
            # UDP source (us, :5060) while keeping the ;alias param — so an inbound
            # call routes back to us over UDP and handle_ruri_alias() recovers the
            # WSS connection.
            set_contact_alias();
        }
    } else if (nat_uac_test("19")) {
        fix_nated_contact();
    }
    setflag(FLT_NAT);
}

# In-dialog: loose-route (no media handling).
route[WITHINDLG] {
    if (loose_route()) {
        if (is_method("INVITE")) {
            record_route();
        }
        # In-dialog request aimed at the WS client (ACK/BYE/re-INVITE from
        # Asterisk): its R-URI carries ;alias=ip~port~proto (WS_REPLY aliased the
        # browser's 2xx Contact at setup). Stock kamailio WS pattern: recover the
        # live WS connection via handle_ruri_alias() when loose_route() hasn't
        # already set a destination. With a SINGLE WS socket and no advertise on
        # it, loose_route() leaves $du empty here, so this runs and resolves to the
        # real WS connection.
        if ($du == "") {
            handle_ruri_alias();
        }
        route(RELAY);
        exit;
    }
    if (is_method("ACK")) {
        if (t_check_trans()) { route(RELAY); }
        exit;
    }
    sl_send_reply("404", "Not Here");
    exit;
}

# Forward everything to Asterisk.
route[TOASTERISK] {
    $du = "sip:ASTERISK_HOST:5060";
    route(RELAY);
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

####### Reply processing #######
# Armed PER-TRANSACTION via t_on_reply("WS_REPLY") ONLY on the inbound INVITE
# (Asterisk → WS client). It therefore never runs on qualify-OPTIONS or REGISTER
# replies — the mistake that broke registration when this was a GLOBAL onreply.
# add_contact_alias() (NOT set_contact_alias) appends ;alias=ip~port~proto to the
# browser's reply Contact ONLY when the source differs (the nat_uac_test(64)
# guard + add_'s own conditional), so Asterisk records an aliased dialog target
# and its ACK to the 200 OK carries the alias — letting handle_ruri_alias() route
# the ACK to the live WSS socket instead of the unroutable .invalid host. That is
# what makes the inbound 200 OK get ACKed promptly and the BYE fire on hangup.
onreply_route[WS_REPLY] {
    if (nat_uac_test("64")) {
        add_contact_alias();
    }
}

####### WebSocket handshake #######
event_route[xhttp:request] {
    if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade" && $rm == "GET") {
        if (ws_handle_handshake()) { exit; }
    }
    xhttp_reply("404", "Not Found", "", "");
}

event_route[websocket:closed] {
    xlog("L_INFO", "WebSocket connection from $si:$sp closed\n");
}
