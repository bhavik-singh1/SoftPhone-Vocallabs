#!KAMAILIO
# =============================================================================
#  kamailio.cfg — SIP-over-WebSocket(WSS) edge in front of Asterisk.
#
#  Role (signaling only):
#   * Terminate the browser's secure WebSocket (WSS) SIP signaling.
#   * Relay SIP transparently to Asterisk, staying in the path (record-route +
#     Path). The SDP is passed through UNTOUCHED — Asterisk now terminates the
#     WebRTC media itself (native DTLS-SRTP + ICE + TURN), so there is no
#     RTPEngine and Kamailio never touches media.
# =============================================================================

####### Defines #######
#!define WITH_TLS
#!define WITH_WEBSOCKETS
#!define FLT_NAT 5

####### Global Parameters #######
debug=2
log_stderror=yes
fork=yes
children=4

# Asterisk is reached by its compose service name.
#!substdef "!ASTERISK_HOST!asterisk!g"

# Plain SIP (Asterisk side) and TLS (carries WSS).
#
# advertise on the UDP socket is the critical fix for the inbound dashboard-
# hangup delay. record_route() writes the SOCKET address into the Record-Route;
# bound to 0.0.0.0, Kamailio literally put "sip:0.0.0.0" in the Asterisk-facing
# Record-Route. Asterisk then sent its ACK for the inbound 200 OK to 0.0.0.0 and
# it was LOST. SIP.js, never seeing the ACK, kept retransmitting the 200 OK and
# (per RFC 3261) REFUSED to send a BYE on the unconfirmed dialog until its
# retransmit timer expired ~15-20s later — exactly the "hangup doesn't cut the
# mobile instantly" symptom. Advertising the Docker service name 'kamailio'
# (Asterisk resolves it via Docker DNS; stable across container recreates) makes
# the ACK route straight back here, the dialog confirms instantly, and the BYE
# now fires the moment you hang up.
#
# The WSS socket needs no advertise: WS clients send in-dialog requests over
# their EXISTING socket regardless of the Route host, so the 0.0.0.0 there is
# harmless (the browser's BYE already routed fine).
listen=udp:0.0.0.0:5060 advertise kamailio:5060
listen=tls:0.0.0.0:8443

tcp_connection_lifetime=3604
tcp_accept_no_cl=yes
tcp_rd_buf_size=16384

enable_tls=yes

####### Modules #######
loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "cfg_rpc.so"
loadmodule "counters.so"
loadmodule "path.so"
loadmodule "xlog.so"
loadmodule "nathelper.so"
loadmodule "tls.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"

####### Module params #######
modparam("rr", "append_fromtag", 0)
modparam("nathelper", "natping_interval", 0)
modparam("tls", "config", "/etc/kamailio/tls.cfg")
modparam("websocket", "keepalive_mechanism", 1)
modparam("websocket", "keepalive_timeout", 30)

####### Routing Logic #######

request_route {
    route(REQINIT);

    if (nat_uac_test("64")) {
        setflag(FLT_NAT);
    }

    # CANCEL handling
    if (is_method("CANCEL")) {
        if (t_check_trans()) { route(RELAY); }
        exit;
    }

    # In-dialog requests: follow the route set
    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    # NAT fixups for WS contacts (signaling only)
    route(NATMANAGE);

    # Record-route dialog-creating requests so we stay in path
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # REGISTER -> relay to Asterisk (the registrar). NATMANAGE already rewrote
    # the WS client's Contact with an ;alias so inbound calls can find it again.
    if (is_method("REGISTER")) {
        route(TOASTERISK);
        exit;
    }

    # Split strictly by transport so the two directions can't cross:
    #   * From the browser's WebSocket          = OUTBOUND -> Asterisk.
    #   * UDP from Asterisk to a WS client       = INBOUND: the Contact alias we
    #     stored at REGISTER rides in the request's R-URI. handle_ruri_alias()
    #     decodes it and targets the browser's live WSS connection.
    if (proto == WS || proto == WSS) {
        route(TOASTERISK);
        exit;
    }
    if (handle_ruri_alias()) {
        route(RELAY);
        exit;
    }

    # Fallback (UDP, no alias): hand to Asterisk.
    route(TOASTERISK);
}

####### Sub-routes #######

route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP from $si:$sp\n");
        exit;
    }
}

# NAT fixups: WS clients advertise unroutable contacts; rewrite them.
route[NATMANAGE] {
    force_rport();
    if (is_method("REGISTER")) {
        # WS/WSS client behind NAT: rewrite its Contact to point back at us with
        # an ;alias holding its real connection (ip~port~proto). Asterisk stores
        # this contact (rewrite_contact=no), so an inbound call to it returns
        # here and handle_ruri_alias() recovers the live WSS socket. We then
        # retarget the host to our SIP/UDP socket — Asterisk only speaks UDP, and
        # set_contact_alias() leaves the host on our WSS port.
        if (proto == WS || proto == WSS) {
            # Append ;alias=ip~port~proto holding the client's live WSS socket.
            # Asterisk (rewrite_contact=yes) then rewrites the Contact HOST to the
            # UDP source (us, :5060) while keeping the ;alias param — so an inbound
            # call routes back to us over UDP and handle_ruri_alias() recovers the
            # WSS connection.
            set_contact_alias();
        }
    } else if (nat_uac_test("19")) {
        fix_nated_contact();
    }
    setflag(FLT_NAT);
}

# In-dialog: loose-route (no media handling).
route[WITHINDLG] {
    if (loose_route()) {
        if (is_method("INVITE")) {
            record_route();
        }
        # In-dialog request aimed at a WS client carries its ;alias in the R-URI.
        # For an ACK/BYE the R-URI is the WS client's DIALOG Contact. SIP.js sets
        # that Contact host to "<rand>.invalid" (RFC 5118 masked WS contact). The
        # alias that lets us reach the live WSS socket is encoded by the
        # onreply_route below (which rewrote the WS client's reply Contact), so by
        # the time Asterisk ACKs, the R-URI already carries ;alias=… and
        # handle_ruri_alias() recovers the socket. Without that, the ACK targets
        # the unroutable .invalid host and is lost — which made SIP.js keep
        # retransmitting its 200 OK and defer the BYE ~15-20s.
        handle_ruri_alias();
        route(RELAY);
        exit;
    }
    if (is_method("ACK")) {
        if (t_check_trans()) { route(RELAY); }
        exit;
    }
    sl_send_reply("404", "Not Here");
    exit;
}

# Forward everything to Asterisk.
route[TOASTERISK] {
    $du = "sip:ASTERISK_HOST:5060";
    route(RELAY);
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

####### Reply processing #######
# Runs for every reply Kamailio's transaction layer sees. The case we MUST fix:
# the browser's 1xx/2xx to an INBOUND INVITE (Asterisk → WS client). That reply
# arrives over the WSS socket and carries the WS client's dialog Contact, whose
# host SIP.js masks as "<rand>.invalid" (RFC 5118) — unreachable by Asterisk.
# Rewriting it here with set_contact_alias() makes Asterisk record the dialog
# target as sip:<user>@<kamailio>;alias=ip~port~proto, so the ACK (and any later
# in-dialog request) lands back here with the alias in its R-URI and
# handle_ruri_alias() routes it to the live WSS socket. This is what lets the
# inbound 200 OK get ACKed promptly — fixing the deferred-BYE / 15-20s hangup.
onreply_route {
    if ((proto == WS || proto == WSS) && $rs =~ "[12][0-9][0-9]") {
        set_contact_alias();
    }
}

####### WebSocket handshake #######
event_route[xhttp:request] {
    if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade" && $rm == "GET") {
        if (ws_handle_handshake()) { exit; }
    }
    xhttp_reply("404", "Not Found", "", "");
}

event_route[websocket:closed] {
    xlog("L_INFO", "WebSocket connection from $si:$sp closed\n");
}
