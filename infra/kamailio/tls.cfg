# Kamailio TLS config for WSS. Cert/key are generated locally with mkcert
# (see infra/kamailio/certs/README.md) and placed as cert.pem / key.pem.
[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/certs/key.pem
certificate = /etc/kamailio/certs/cert.pem

[client:default]
verify_certificate = no
require_certificate = no
