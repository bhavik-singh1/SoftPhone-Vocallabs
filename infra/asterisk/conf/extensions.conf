;==============================================================================
;  extensions.conf  (template — only ${TRUNK_*} and ${SOFTPHONE_USER} are
;  substituted; ${EXTEN}/${UNIQUEID}/${CALLERID(...)} are real dialplan vars.)
;==============================================================================

[general]
static=yes
writeprotect=no

;------------------- Outbound: softphone → PSTN trunk -------------------------
[from-internal]
; Local audio/echo test: dial 600 to hear your own voice looped back. This
; exercises the full browser<->RTPEngine<->Asterisk WebRTC media path WITHOUT
; the trunk, so it works locally and proves audio + latency end-to-end.
exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

exten => _X.,1,NoOp(Softphone outbound to ${EXTEN})
 same => n,Set(CALLERID(num)=${TRUNK_CALLER_ID})
 same => n,Set(CALLERID(name)=${TRUNK_CALLER_ID})
 ; Record both legs; filename = channel UNIQUEID so the backend can map it.
 same => n,MixMonitor(/var/spool/asterisk/recordings/${UNIQUEID}.wav)
 ; Prepend the trunk prefix, then dial out the trunk.
 same => n,Dial(PJSIP/${TRUNK_PREFIX}${EXTEN}@trunk,60,tT)
 same => n,Hangup()

;------------------- Inbound: trunk (DID) → softphone -------------------------
; A call to our DID arrives and rings the browser softphone (Asterisk → Kamailio
; → WSS). The caller's number rides in on CALLERID(num) from the trunk's From.
;
; DE-DUPLICATION: the carrier forks each inbound call to MULTIPLE registered
; contacts, so the SAME call reaches Asterisk twice — once matching the inbound
; trunk (by line) and once the outbound trunk (by IP-identify). Both then Dial
; the single browser contact at once; the 2nd hits "busy/congested" and the
; whole call collapses to no-answer. TRYLOCK lets ONLY the first leg ring; the
; duplicate is dropped quietly so it can't cancel the real call. (The lock is
; auto-released when the ringing channel ends.)
[from-trunk]
exten => _X.,1,NoOp(Inbound from ${CALLERID(num)} to DID ${EXTEN})
 same => n,Goto(ring,1)
; Some carriers send the call to extension "s" (no DID in the R-URI).
exten => s,1,NoOp(Inbound from ${CALLERID(num)} (no DID))
 same => n,Goto(ring,1)

exten => ring,1,GotoIf($["${TRYLOCK(webrtcring)}" != "1"]?dup,1)
 same => n,Set(CALLERID(name)=${CALLERID(num)})
 same => n,Dial(PJSIP/${SOFTPHONE_USER},45)
 same => n,Set(UNUSED=${UNLOCK(webrtcring)})
 same => n,Hangup()

exten => dup,1,NoOp(Duplicate forked inbound leg — dropping to avoid double-ring)
 same => n,Hangup()

;==============================================================================
;  CONFERENCE: "call two numbers at once" (multi-call).
;  The backend (AMI) drives this:
;    1. Redirect the browser's active channel into conf-join, Exten=<room>.
;    2. Originate PJSIP/<prefix><number>@trunk for EACH number, with the
;       originated leg's answer landing in conf-dial, Exten=<room> (caller-ID +
;       per-leg recording set there). Both legs join the SAME <room> so the
;       browser + whoever answers share one audio mix. A leg that never answers
;       just never joins; the call continues with the others.
;  ${EXTEN} = the room id; channel var ROOM is also set for clarity.
;==============================================================================

; The browser leg joins the room here (Redirected in by the backend). It's the
; conference owner; record the whole mix to <room>.wav for history.
[conf-join]
exten => _.,1,NoOp(Browser joining conference ${EXTEN})
 same => n,Answer()
 same => n,Set(CONFBRIDGE(bridge,record_conference)=yes)
 same => n,Set(CONFBRIDGE(bridge,record_file)=/var/spool/asterisk/recordings/${EXTEN}.wav)
 same => n,ConfBridge(${EXTEN},conf_bridge,conf_owner)
 same => n,Hangup()

; An originated PSTN leg lands here on answer and joins the same room. Present
; our trunk caller-ID outward (same as normal outbound) so the carrier accepts
; it; the room id rides in on ${EXTEN}.
[conf-dial]
exten => _.,1,NoOp(PSTN leg answered — joining conference ${EXTEN})
 same => n,Set(CALLERID(num)=${TRUNK_CALLER_ID})
 same => n,Set(CALLERID(name)=${TRUNK_CALLER_ID})
 same => n,ConfBridge(${EXTEN},conf_bridge,conf_user)
 same => n,Hangup()
