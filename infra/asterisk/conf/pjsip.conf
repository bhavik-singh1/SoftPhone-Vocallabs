;==============================================================================
;  pjsip.conf  (template — rendered by entrypoint.sh)
;  Topology: Browser →(WSS/DTLS)→ Kamailio+RTPEngine →(SIP/RTP)→ Asterisk.
;  Asterisk therefore sees plain SIP + RTP for the softphone (no webrtc here).
;==============================================================================

;------------------------------- Transport -----------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Advertise the routable IP in SDP so the PSTN trunk can reach our media.
; (On a VPS set PUBLIC_IP to the public IP; locally, your LAN IP + router
;  port-forwarding of the RTP range is needed for trunk-leg audio.)
external_media_address=${PUBLIC_IP}
external_signaling_address=${PUBLIC_IP}
local_net=172.16.0.0/12
local_net=10.0.0.0/8
local_net=192.168.0.0/16

;=========================== PSTN trunk (provider) ============================
[trunk-reg]
type=registration
transport=transport-udp
outbound_auth=trunk-auth
server_uri=sip:${TRUNK_HOST}:${TRUNK_PORT}
client_uri=sip:${TRUNK_USERNAME}@${TRUNK_HOST}:${TRUNK_PORT}
contact_user=${TRUNK_USERNAME}
retry_interval=30
forbidden_retry_interval=300
expiration=3600
line=yes
endpoint=trunk

[trunk-auth]
type=auth
auth_type=userpass
username=${TRUNK_USERNAME}
password=${TRUNK_PASSWORD}

[trunk-aor]
type=aor
contact=sip:${TRUNK_HOST}:${TRUNK_PORT}
qualify_frequency=60

[trunk]
type=endpoint
context=from-trunk
disallow=all
allow=ulaw,alaw
outbound_auth=trunk-auth
aors=trunk-aor
; No from_user override — let the dialplan's CALLERID(num) (= the DID) populate
; the From header, which the provider requires to authorize the call.
from_domain=${TRUNK_HOST}
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; Present the DID as connected/asserted identity too (some providers check this).
trust_id_outbound=yes
send_pai=yes

[trunk-identify]
type=identify
endpoint=trunk
match=${TRUNK_HOST}

;========================= Softphone (browser) account ========================
; The AOR object MUST be named exactly the registering username so the PJSIP
; registrar can match incoming REGISTERs (To: sip:webrtc@...). Endpoint and AOR
; share the name (standard PJSIP pattern); auth uses a distinct name.
[${SOFTPHONE_USER}]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw
auth=${SOFTPHONE_USER}-auth
aors=${SOFTPHONE_USER}
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[${SOFTPHONE_USER}-auth]
type=auth
auth_type=userpass
username=${SOFTPHONE_USER}
password=${SOFTPHONE_PASSWORD}

[${SOFTPHONE_USER}]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30
