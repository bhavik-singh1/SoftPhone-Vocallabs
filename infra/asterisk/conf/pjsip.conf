;==============================================================================
;  pjsip.conf  (template — rendered by entrypoint.sh)
;  Topology: Browser →(WSS/DTLS)→ Kamailio+RTPEngine →(SIP/RTP)→ Asterisk.
;  Asterisk therefore sees plain SIP + RTP for the softphone (no webrtc here).
;==============================================================================

;------------------------------- Transport -----------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Advertise the routable IP in SDP so the PSTN trunk can reach our media.
; (On a VPS set PUBLIC_IP to the public IP; locally, your LAN IP + router
;  port-forwarding of the RTP range is needed for trunk-leg audio.)
external_media_address=${PUBLIC_IP}
external_signaling_address=${PUBLIC_IP}
local_net=172.16.0.0/12
local_net=10.0.0.0/8
local_net=192.168.0.0/16

;=========================== PSTN trunk (provider) ============================
[trunk-reg]
type=registration
transport=transport-udp
outbound_auth=trunk-auth
server_uri=sip:${TRUNK_HOST}:${TRUNK_PORT}
client_uri=sip:${TRUNK_USERNAME}@${TRUNK_HOST}:${TRUNK_PORT}
contact_user=${TRUNK_USERNAME}
retry_interval=30
forbidden_retry_interval=300
; The carrier only honors a ~26s registration, but Asterisk refreshes based on
; THIS requested value (not the granted one) — at 3600 it re-registered only
; every ~30min, so the carrier dropped our binding after 26s and inbound died
; ("server error") until a restart. Re-register every ~18s to stay inside the
; carrier's window so inbound calls are always deliverable.
expiration=20
line=yes
endpoint=trunk

[trunk-auth]
type=auth
auth_type=userpass
username=${TRUNK_USERNAME}
password=${TRUNK_PASSWORD}

[trunk-aor]
type=aor
contact=sip:${TRUNK_HOST}:${TRUNK_PORT}
qualify_frequency=60

[trunk]
type=endpoint
context=from-trunk
disallow=all
allow=ulaw,alaw
outbound_auth=trunk-auth
aors=trunk-aor
; No from_user override — let the dialplan's CALLERID(num) (= the DID) populate
; the From header, which the provider requires to authorize the call.
from_domain=${TRUNK_HOST}
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; Present the DID as connected/asserted identity too (some providers check this).
trust_id_outbound=yes
send_pai=yes

[trunk-identify]
type=identify
endpoint=trunk
match=${TRUNK_HOST}

;=========================== INBOUND trunk (DID) ==============================
; A SECOND registration on the SAME gateway, for the DID that RECEIVES calls.
; line=yes tags our REGISTER Contact so the provider's inbound INVITE is matched
; back to this endpoint by the line param — this avoids an IP-based identify
; clash with the outbound trunk (both share ${TRUNK_HOST}). Inbound calls land
; in from-trunk and ring the softphone. NEVER place outbound via this account —
; the carrier flags it as spam / routes it through a fallback number.
[trunk-in-reg]
type=registration
transport=transport-udp
outbound_auth=trunk-in-auth
server_uri=sip:${TRUNK_HOST}:${TRUNK_PORT}
client_uri=sip:${INBOUND_USERNAME}@${TRUNK_HOST}:${TRUNK_PORT}
contact_user=${INBOUND_USERNAME}
retry_interval=30
forbidden_retry_interval=300
; The carrier only honors a ~26s registration, but Asterisk refreshes based on
; THIS requested value (not the granted one) — at 3600 it re-registered only
; every ~30min, so the carrier dropped our binding after 26s and inbound died
; ("server error") until a restart. Re-register every ~18s to stay inside the
; carrier's window so inbound calls are always deliverable.
expiration=20
line=yes
endpoint=trunk-in

[trunk-in-auth]
type=auth
auth_type=userpass
username=${INBOUND_USERNAME}
password=${INBOUND_PASSWORD}

[trunk-in-aor]
type=aor
contact=sip:${TRUNK_HOST}:${TRUNK_PORT}
qualify_frequency=60

[trunk-in]
type=endpoint
context=from-trunk
disallow=all
allow=ulaw,alaw
outbound_auth=trunk-in-auth
aors=trunk-in-aor
from_domain=${TRUNK_HOST}
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

;========================= Softphone (browser) account ========================
; The AOR object MUST be named exactly the registering username so the PJSIP
; registrar can match incoming REGISTERs (To: sip:webrtc@...). Endpoint and AOR
; share the name (standard PJSIP pattern); auth uses a distinct name.
[${SOFTPHONE_USER}]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw
auth=${SOFTPHONE_USER}-auth
aors=${SOFTPHONE_USER}
; --- Native WebRTC: Asterisk terminates DTLS-SRTP + ICE itself (uses TURN
;     from rtp.conf to relay through CGNAT). webrtc=yes implies dtls,
;     ice_support, rtcp_mux, use_avpf, bundle. ---
webrtc=yes
dtls_auto_generate_cert=yes
; rewrite_contact=yes: rewrites the Contact HOST to the UDP source (Kamailio),
; so Asterisk routes requests to it over UDP. Kamailio's set_contact_alias adds
; a ;alias=<client-wss> param (preserved by the host rewrite) that Kamailio's
; handle_ruri_alias() later uses to deliver inbound calls to the browser's WSS.
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes
dtmf_mode=rfc4733

[${SOFTPHONE_USER}-auth]
type=auth
auth_type=userpass
username=${SOFTPHONE_USER}
password=${SOFTPHONE_PASSWORD}

[${SOFTPHONE_USER}]
type=aor
; ONE contact only: each browser reload / mobile-IP change opens a NEW WebSocket
; and re-registers. Keeping 2 contacts meant a call could fork to an OLD, dead
; connection -> Kamailio 500 -> "server error" on the caller. max_contacts=1 +
; remove_existing keeps just the latest LIVE connection, so inbound is reliable.
max_contacts=1
remove_existing=yes
qualify_frequency=30
; Drop a contact as soon as qualify finds its WebSocket dead, so an inbound call
; never gets routed to a stale connection (which returns 500 "server error").
remove_unavailable=yes
; REQUIRED for inbound: store the Path (RFC 3327) that Kamailio inserts at
; REGISTER so Asterisk routes inbound INVITEs back THROUGH Kamailio (which then
; loose-routes to the browser's WSS connection). Without this, inbound calls to
; the browser are sent to an unroutable .invalid contact and never arrive.
support_path=yes
