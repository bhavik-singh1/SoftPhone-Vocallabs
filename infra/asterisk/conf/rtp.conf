;==============================================================================
;  rtp.conf — media port range + ICE/STUN/TURN for native WebRTC.
;  Asterisk now terminates WebRTC media itself (DTLS-SRTP + ICE), and uses an
;  external TURN server (metered.ca) so it gathers its OWN relay candidate.
;  That gives a relay<->relay path with the browser that traverses CGNAT.
;==============================================================================
[general]
rtpstart=10000
rtpend=10050

; Accept trunk RTP even when the carrier's media gateway sends from a different
; IP than was signaled (common on certain PSTN routes -> fixes route-specific
; one-way audio). Asterisk then learns the real source via symmetric RTP
; (rtp_symmetric=yes on the trunk endpoint handles the send direction).
strictrtp=no

; --- ICE / NAT traversal for WebRTC ---
icesupport=yes
; STUN: discover Asterisk's server-reflexive (public) candidate.
stunaddr=stun.relay.metered.ca:80
; TURN: allocate a relay candidate on the external relay (works through CGNAT).
turnaddr=global.relay.metered.ca
turnport=80
turnusername=${METERED_TURN_USER}
turnpassword=${METERED_TURN_CRED}
