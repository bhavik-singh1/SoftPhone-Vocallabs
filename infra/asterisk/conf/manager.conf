;==============================================================================
;  manager.conf (AMI) — the Node backend connects here to read live call
;  events (Newchannel, Newstate, DialBegin/End, Hangup) and map recordings.
;==============================================================================
[general]
enabled=yes
port=5038
bindaddr=0.0.0.0

[${AMI_USER}]
secret=${AMI_PASSWORD}
; Demo: open to the docker network. TIGHTEN to the backend's subnet in prod.
deny=0.0.0.0/0.0.0.0
permit=0.0.0.0/0.0.0.0
read=system,call,log,verbose,command,dtmf,dialplan,cdr
write=system,call,command,originate
