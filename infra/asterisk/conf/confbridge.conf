;==============================================================================
;  confbridge.conf — mixing rooms for the "call two numbers at once" feature.
;
;  A conference room is created on the fly by the dialplan (ConfBridge(<room>)).
;  Three legs share one audio mix: the browser (you) + the two PSTN legs that
;  the backend originates through the trunk. Everyone hears the mix; a leg that
;  never answers simply never joins, and the call continues with whoever did.
;==============================================================================

[general]

;--- Bridge profile: how the room mixes audio -------------------------------
[conf_bridge](type=bridge)
; internal_sample_rate=auto + mixing_interval default is fine for G.711 voice.
max_members=10
; Record the WHOLE conference mix to one file. <conf-id> is set by the dialplan
; via CONFBRIDGE(bridge,record_file). record_conference is enabled per-room.
record_conference=no

;--- User profile: how an ORIGINATED PSTN leg behaves in the room -----------
; Normal talker: hears the mix and is heard. No menu, no marked-user gating, so
; the room is live as soon as ANY single leg joins (you can talk to the first
; answerer while the second is still ringing).
[conf_user](type=user)
announce_join_leave=no
announce_user_count=no
wait_marked=no
end_marked=no
dtmf_passthrough=yes
; Brief comfort: no music-on-hold loop when alone — you may be the only one in
; the room while both PSTN legs are still ringing.
music_on_hold_when_empty=no

;--- User profile for the BROWSER (you), the conference owner ---------------
; Same as the talker; kept separate so host-only behaviour can be added later
; (e.g. ending the room when you leave) without touching the PSTN legs.
[conf_owner](type=user)
announce_join_leave=no
announce_user_count=no
wait_marked=no
end_marked=no
dtmf_passthrough=yes
music_on_hold_when_empty=no
