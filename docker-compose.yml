# ──────────────────────────────────────────────────────────────────────────
#  SoftPhone-Vocallabs — full VoIP stack
#  Browser (SIP.js/WebRTC) → Kamailio (WSS edge) + RTPEngine (media) →
#  Asterisk (PBX + trunk + recording) → PSTN.  Backend + React on the side.
#
#  Run from inside WSL2:  docker compose up -d --build
# ──────────────────────────────────────────────────────────────────────────

services:
  # ===== Postgres: users, contacts, call logs (CDR) =====
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [softphone-net]

  # ===== Asterisk: PBX, PSTN trunk, dialplan, MixMonitor recording, AMI =====
  asterisk:
    build: ./infra/asterisk
    restart: unless-stopped
    # envsubst at container start fills the trunk/secret placeholders in conf.
    environment:
      TRUNK_HOST: ${TRUNK_HOST}
      TRUNK_PORT: ${TRUNK_PORT}
      TRUNK_USERNAME: ${TRUNK_USERNAME}
      TRUNK_PASSWORD: ${TRUNK_PASSWORD}
      TRUNK_PREFIX: ${TRUNK_PREFIX}
      TRUNK_CALLER_ID: ${TRUNK_CALLER_ID}
      INBOUND_USERNAME: ${INBOUND_USERNAME}
      INBOUND_PASSWORD: ${INBOUND_PASSWORD}
      INBOUND_DID: ${INBOUND_DID}
      SOFTPHONE_USER: ${SOFTPHONE_USER}
      SOFTPHONE_PASSWORD: ${SOFTPHONE_PASSWORD}
      AMI_USER: ${AMI_USER}
      AMI_PASSWORD: ${AMI_PASSWORD}
      PUBLIC_IP: ${PUBLIC_IP}
      METERED_TURN_USER: ${METERED_TURN_USER}
      METERED_TURN_CRED: ${METERED_TURN_CRED}
    volumes:
      - ./infra/asterisk/conf:/etc/asterisk/templates:ro
      - ./infra/asterisk/entrypoint.sh:/entrypoint.sh:ro
      - recordings:/var/spool/asterisk/recordings
    ports:
      - "5038:5038"                  # AMI (backend reads call events)
      - "5062:5060/udp"              # SIP UDP (Kamailio talks to this; host-mapped for debugging)
      - "10000-10050:10000-10050/udp" # RTP media (Asterisk ↔ RTPEngine)
    networks: [softphone-net]
    depends_on:
      db:
        condition: service_healthy

  # ===== RTPEngine: bridges WebRTC DTLS-SRTP ↔ plain RTP for Asterisk =====
  rtpengine:
    image: drachtio/rtpengine:latest
    restart: unless-stopped
    # HOST networking: the docker bridge NAT mangles RTP/ICE so WebRTC media
    # can't establish (it forces a broken TURN relay). On the host network the
    # media UDP is not rewritten, preserving the source port ICE needs.
    #   internal -> host primary IP (Asterisk reaches it via the host)
    #   external -> ${PUBLIC_IP} advertised to the browser
    network_mode: host
    command:
      - sh
      - -c
      - >
        IP=$$(hostname -I | awk '{print $$1}');
        exec rtpengine
        --interface=internal/$$IP
        --interface=external/$$IP!${PUBLIC_IP}
        --listen-ng=0.0.0.0:22222
        --port-min=30000 --port-max=30050
        --log-level=6 --foreground --log-stderr

  # ===== Kamailio: SIP-over-WSS edge, RTPEngine control, relay to Asterisk =====
  kamailio:
    build: ./infra/kamailio
    restart: unless-stopped
    # RTPEngine runs on the host network now; reach its control socket via the
    # docker host gateway (host.docker.internal -> host-gateway).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PUBLIC_IP: ${PUBLIC_IP}
      ASTERISK_HOST: asterisk
      RTPENGINE_HOST: rtpengine
    volumes:
      - ./infra/kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./infra/kamailio/certs:/etc/kamailio/certs:ro
      - ./infra/kamailio/tls.cfg:/etc/kamailio/tls.cfg:ro
    ports:
      - "8443:8443"                  # WSS (browser SIP signaling, direct)
      - "5060:5060/udp"              # SIP UDP (optional, debugging)
    expose:
      - "8080"                       # plain WS for the Caddy proxy hop (internal)
    # Static IP so the cfg can force the WSS send-socket ($fs=tls:172.18.0.10:8443)
    # for in-dialog requests to WS clients — the WS connection lookup is keyed by
    # the local socket, so it must be a stable, real address (not advertised).
    networks:
      softphone-net:
        ipv4_address: 172.18.0.10
    depends_on: [asterisk, rtpengine]

  # ===== coturn: STUN/TURN for browser NAT traversal =====
  # HOST networking + external-ip=PUBLIC/PRIVATE so the relay address it hands
  # out is the public IP but it binds the host's private IP. Combined with the
  # EC2 hairpin route (deploy-vps.sh), RTPEngine on the same host can reach the
  # relay. Restrictive mobile/CGNAT clients relay all media through :3478 here.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    # Flags are args to the image's turnserver entrypoint (no shell wrapper).
    # PRIVATE_IP is the host's private IP (set by deploy-vps.sh); external-ip
    # advertises the public IP but binds/relays on the private IP.
    command: >
      -n --log-file=stdout --no-tls --no-dtls --fingerprint
      --listening-port=3478 --min-port=49160 --max-port=49200
      --use-auth-secret --static-auth-secret=${TURN_SECRET}
      --realm=${TURN_REALM}
      --listening-ip=${PRIVATE_IP} --relay-ip=${PRIVATE_IP}
      --external-ip=${PUBLIC_IP}/${PRIVATE_IP}

  # ===== Backend: auth, AMI live-event bridge, WS push, CDR/recordings API =====
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - recordings:/recordings:ro     # serve recordings for playback/download
    ports:
      - "${BACKEND_PORT}:3000"
    networks: [softphone-net]
    depends_on:
      db:
        condition: service_healthy

  # ===== Frontend: React + SIP.js (Vite dev server over HTTPS) =====
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_PUBLIC_HOST: ${PUBLIC_HOST}
      VITE_BACKEND_PORT: ${BACKEND_PORT}
    volumes:
      - ./frontend:/app                   # live source for HMR (instant UI changes)
      - /app/node_modules                 # keep the container's Linux deps
      - ./infra/kamailio/certs:/certs:ro  # reuse mkcert cert for HTTPS dev server
    ports:
      - "5173:5173"
    networks: [softphone-net]
    depends_on: [backend]

  # ===== Caddy: public TLS edge so the app lives at clean https://${PUBLIC_HOST}
  # (no :5173 / :8443 in the URL). Terminates Let's Encrypt TLS on 443 and
  # reverse-proxies the dashboard, /api, /ws, and the SIP WebSocket (/ws-sip ->
  # Kamailio plain-WS :8080). The old :5173 / :8443 stay open for transition. =====
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${PUBLIC_HOST}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                 # persists the issued cert across restarts
      - caddy_config:/config
    ports:
      # Only :443 — Caddy uses the TLS-ALPN-01 ACME challenge (over 443), leaving
      # :80 free for the deploy script's certbot (Kamailio's direct :8443 cert).
      - "443:443"                        # the clean https://${PUBLIC_HOST}
    networks: [softphone-net]
    depends_on: [frontend, kamailio]

networks:
  softphone-net:
    driver: bridge
    # Pin the subnet so the gateway is always 172.18.0.1 — Kamailio uses that
    # to reach RTPEngine's control socket on the host network.
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1

volumes:
  pg-data:
  recordings:
  caddy_data:
  caddy_config:
